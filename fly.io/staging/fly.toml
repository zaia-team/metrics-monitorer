app = 'metrics-monitorer-staging'

[build]
  [build.args]
    MB_EDITION = "oss"
    VERSION = ""

[[mounts]]
  source = 'metabase_data_staging'
  destination = '/metabase-data'
  initial_size = "1GB"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.checks]
    [http_service.checks.alive]
      grace_period = "60s"
      interval = "30s"
      method = "GET"
      timeout = "5s"
      path = "/api/health"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1